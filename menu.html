<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>La Jaiba Gastrobar – Menú</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ocean-deep: #0a1628;
      --seafoam:    #1a8fa0;
      --gold:       #c9a84c;
      --gold-light: #e8c96a;
      --cream:      #f5ede0;
      --coral:      #e05c3a;
      --white:      #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background: var(--ocean-deep);
      color: var(--cream);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Ocean background */
    .ocean-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 80%, rgba(13,79,107,.45) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(26,143,160,.25) 0%, transparent 55%),
        linear-gradient(160deg,#061020 0%,#0a1628 45%,#0e2a45 70%,#091522 100%);
    }

    /* Bubbles */
    .bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bubble {
      position: absolute; border-radius: 50%;
      background: rgba(26,143,160,.10);
      border: 1px solid rgba(201,168,76,.12);
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0); opacity: 0; }
      10%  { opacity: .7; }
      90%  { opacity: .2; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }

    /* Page wrapper */
    .page {
      position: relative; z-index: 1;
      max-width: 860px; margin: 0 auto;
      padding: 0 12px 60px;
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 48px 16px 36px;
      animation: fadeDown .8s ease both;
    }
    .crab-icon {
      font-size: 2.8rem; display: block; margin-bottom: 8px;
      filter: drop-shadow(0 0 16px rgba(224,92,58,.6));
      animation: crabPulse 3s ease-in-out infinite;
    }
    @keyframes crabPulse {
      0%,100% { transform: scale(1) rotate(-3deg); }
      50%      { transform: scale(1.08) rotate(3deg); }
    }
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem,7vw,4.5rem); font-weight: 700;
      letter-spacing: .06em; color: var(--white);
      text-shadow: 0 0 36px rgba(201,168,76,.4), 0 4px 16px rgba(0,0,0,.5);
      line-height: 1;
    }
    .brand-sub {
      font-weight: 300; font-size: clamp(.8rem,2.2vw,1rem);
      letter-spacing: .45em; text-transform: uppercase;
      color: var(--gold); margin-top: 6px;
    }
    .divider {
      display: flex; align-items: center; gap: 14px;
      margin: 16px auto; width: fit-content;
    }
    .divider-line { width: 60px; height: 1px; background: linear-gradient(to right, transparent, var(--gold)); }
    .divider-line.r { background: linear-gradient(to left, transparent, var(--gold)); }
    .anchor { color: var(--gold); }
    .tagline {
      font-style: italic; font-size: clamp(.9rem,2.2vw,1.1rem);
      color: rgba(245,237,224,.55); letter-spacing: .04em;
    }

    /* Menu images */
    .menu-pages {
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeUp .9s ease .2s both;
    }

    .menu-page-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(201,168,76,.28);
      box-shadow:
        0 0 0 1px rgba(201,168,76,.06),
        0 16px 48px rgba(0,0,0,.55);
      transition: transform .25s, box-shadow .25s;
    }
    .menu-page-wrap:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 64px rgba(0,0,0,.65);
    }

    .page-label {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(10,22,40,.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201,168,76,.35);
      border-radius: 50px;
      padding: 5px 20px;
      font-size: .72rem; letter-spacing: .2em;
      text-transform: uppercase; color: var(--gold-light);
      white-space: nowrap;
    }

    .menu-img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Zoom button */
    .zoom-btn {
      position: absolute; bottom: 14px; right: 14px;
      background: rgba(10,22,40,.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(201,168,76,.4);
      border-radius: 50px;
      color: var(--gold);
      font-size: .75rem; letter-spacing: .1em;
      padding: 6px 14px;
      cursor: pointer; text-decoration: none;
      transition: background .2s;
    }
    .zoom-btn:hover { background: rgba(201,168,76,.2); }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 999;
      background: rgba(6,16,32,.96);
      backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
      padding: 16px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .lightbox img {
      max-width: min(90vw, 700px);
      max-height: 92vh;
      border-radius: 12px;
      box-shadow: 0 0 80px rgba(0,0,0,.8);
      cursor: default;
    }
    .lightbox-close {
      position: fixed; top: 20px; right: 20px;
      background: rgba(201,168,76,.15);
      border: 1px solid rgba(201,168,76,.4);
      color: var(--gold-light);
      font-size: 1.4rem; width: 44px; height: 44px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .2s;
    }
    .lightbox-close:hover { background: rgba(201,168,76,.35); }
    .lightbox-arrows {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 16px;
    }
    .lb-arrow {
      background: rgba(201,168,76,.15);
      border: 1px solid rgba(201,168,76,.35);
      color: var(--gold-light);
      font-size: .9rem; padding: 8px 20px; border-radius: 50px;
      cursor: pointer; transition: background .2s; letter-spacing: .08em;
    }
    .lb-arrow:hover { background: rgba(201,168,76,.3); }

    /* Footer */
    .footer {
      text-align: center; margin-top: 52px;
      padding: 28px 16px;
      border-top: 1px solid rgba(201,168,76,.14);
      font-size: .82rem; color: rgba(245,237,224,.28);
      letter-spacing: .1em;
    }
    .footer span { color: var(--coral); }

    @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(20px);  } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="ocean-bg"></div>
<div class="bubbles" id="bubbles"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightboxDirect()">✕</button>
  <img id="lb-img" src="" alt="Menú"/>
  <div class="lightbox-arrows">
    <button class="lb-arrow" onclick="lbNav(-1); event.stopPropagation()">← Anterior</button>
    <button class="lb-arrow" onclick="lbNav(1); event.stopPropagation()">Siguiente →</button>
  </div>
</div>

<div class="page">

  <!-- Hero -->
  <header class="hero">
    <span class="crab-icon">🦀</span>
    <h1 class="brand-name">La Jaiba</h1>
    <p class="brand-sub">Gastrobar</p>
    <div class="divider">
      <span class="divider-line"></span>
      <span class="anchor">⚓</span>
      <span class="divider-line r"></span>
    </div>
    <p class="tagline">Tradición marina con el mejor sazón</p>
  </header>

  <!-- Menu pages -->
  <div class="menu-pages">

    <div class="menu-page-wrap">
      <span class="page-label">Página 1 · Entradas · Sancochos · Cazuelas · Paellas · Pescados</span>
      <img class="menu-img" src="menu1.jpg" alt="Menú La Jaiba – Página 1" onclick="openLightbox(0)"/>
      <button class="zoom-btn" onclick="openLightbox(0)">🔍 Ver completo</button>
    </div>

    <div class="menu-page-wrap">
      <span class="page-label">Página 2 · Pizzas · Bebidas · Licores · Cócteles</span>
      <img class="menu-img" src="menu2.jpg" alt="Menú La Jaiba – Página 2" onclick="openLightbox(1)"/>
      <button class="zoom-btn" onclick="openLightbox(1)">🔍 Ver completo</button>
    </div>

  </div>

  <footer class="footer">
    <span>🦀</span> &nbsp;La Jaiba Gastrobar &nbsp;·&nbsp; Tradición marina con el mejor sazón &nbsp;<span>🦀</span>
    <br><br>¡Gracias por preferirnos!
  </footer>

</div>

<script>
  // Bubbles
  const bc = document.getElementById('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const s = Math.random() * 14 + 4;
    b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:-${s}px;animation-duration:${Math.random()*14+8}s;animation-delay:${Math.random()*10}s;`;
    bc.appendChild(b);
  }

  // Lightbox
  const pages = ['menu1.jpg', 'menu2.jpg'];
  let current = 0;

  function openLightbox(idx) {
    current = idx;
    document.getElementById('lb-img').src = pages[current];
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLightboxDirect() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  function closeLightbox(e) {
    if (e.target === document.getElementById('lightbox')) closeLightboxDirect();
  }
  function lbNav(dir) {
    current = (current + dir + pages.length) % pages.length;
    document.getElementById('lb-img').src = pages[current];
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightboxDirect();
    if (e.key === 'ArrowRight') lbNav(1);
    if (e.key === 'ArrowLeft') lbNav(-1);
  });
</script>
</body>
</html>
